[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-conversion-analytics"
version = "0.1.0"
description = "Воспроизводимый учебный кейс по аналитике онлайн-платежей"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "plotly>=5.18,<7", "streamlit>=1.36,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
